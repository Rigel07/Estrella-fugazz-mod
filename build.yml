name: Build Estrella Magica Fugaz

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.1.1 (sin wrapper)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Build
        run: gradle build --no-daemon

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: estrella-magica-fugaz-jar
          path: build/libs/*.jar
